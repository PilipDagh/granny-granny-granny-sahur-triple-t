 <!DOCTYPE html>
<html>
<head>
    <title>Tung Tung Tung Sahorror</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
    <!-- Main Menu -->
    <div id="main-menu">
        <h1>Tung Tung Tung Sahorror</h1>
        <div class="menu-box">
            <input type="text" id="username-input" placeholder="Enter Username...">
            <button id="btn-singleplayer">Play Single Player</button>
            <button id="btn-multiplayer">Join Public Server</button>
            <button id="btn-settings">Settings</button>
        </div>
    </div>

    <!-- Settings Menu -->
    <div id="settings-menu" class="hidden">
        <h2>Settings</h2>
        <label>Sensitivity: <input type="range" id="sensitivity" min="1" max="10" value="5"></label>
        <br>
        <label>Mobile Controls: <input type="checkbox" id="mobile-toggle"></label>
        <br>
        <button id="btn-back">Back</button>
    </div>

    <!-- Game HUD -->
    <div id="game-ui" class="hidden">
        <div id="pause-btn">||</div>
        <div id="lives-display">Lives: 5</div>
        <div id="crosshair">+</div>
        
        <!-- Mobile Joysticks -->
        <div id="joystick-move" class="joystick hidden"></div>
        <div id="joystick-look" class="joystick hidden"></div>
        
        <div id="interact-prompt">Press E to interact</div>
    </div>

    <!-- Pause Menu -->
    <div id="pause-menu" class="hidden">
        <h2>Paused</h2>
        <button id="btn-resume">Resume</button>
        <button id="btn-exit">Exit to Menu</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="client.js"></script>
</body>
</html>
