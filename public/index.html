<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tung Tung Tung Sahorror: Escape House 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu" class="ui-layer">
        <h1 class="title">TUNG TUNG TUNG SAHORROR</h1>
        <p class="subtitle">Escape House 3D Granny</p>
        <div class="menu-box">
            <input type="text" id="username-input" placeholder="Enter Username (Optional)" maxlength="15">
            <button id="btn-singleplayer">Play Single Player</button>
            <button id="btn-multiplayer">Join Public Server (50 Max)</button>
            <button id="btn-settings">Settings</button>
        </div>
    </div>

    <div id="settings-menu" class="ui-layer hidden">
        <h2>SETTINGS</h2>
        <div class="settings-box">
            <label>Look Sensitivity: <span id="sens-val">0.0005</span></label>
            <input type="range" id="sensitivity" min="1" max="50" value="5">
            <br><br>
            <label class="checkbox-container">Enable Mobile Controls
                <input type="checkbox" id="mobile-toggle">
            </label>
            <br><br>
            <button id="btn-back-settings">Back to Menu</button>
        </div>
    </div>

    <!-- WARDROBE MENU -->
    <div id="wardrobe-menu" class="ui-layer hidden">
        <h2>CUSTOMIZE CHARACTER</h2>
        <div class="settings-box">
            <label>Hair: <input type="color" id="color-hair" value="#000000"></label>
            <label>Skin: <input type="color" id="color-skin" value="#ffccaa"></label>
            <label>Shirt: <input type="color" id="color-clothes" value="#2244aa"></label>
            <label>Pants: <input type="color" id="color-pants" value="#111111"></label>
            <label>Shoes: <input type="color" id="color-shoes" value="#333333"></label>
            <br>
            <button id="btn-save-wardrobe">Save & Exit</button>
        </div>
    </div>

    <div id="pause-menu" class="ui-layer hidden">
        <h2>PAUSED</h2>
        <div class="menu-box">
            <button id="btn-resume">Resume</button>
            <button id="btn-leave">Leave Game</button>
        </div>
    </div>

    <div id="death-screen" class="ui-layer hidden">
        <h1 id="day-text">DAY 2</h1>
        <p id="death-subtext">Tung Tung Sahur caught you...</p>
    </div>

    <div id="game-ui" class="hidden">
        <div id="pause-btn">||</div>
        <div id="lives-display">Lives: 5</div>
        <div id="ammo-display" class="hidden">Arrows: 3</div>
        <div id="domain-display" class="hidden">DOMAIN EXPANSION: READY (Press J)</div>
        <div id="crosshair">+</div>
        <div id="interact-prompt"></div>
        <div id="inventory-display">Holding: Nothing</div>
        
        <div id="joystick-move" class="joystick hidden"><div class="knob"></div></div>
        <div id="joystick-look" class="joystick hidden"><div class="knob"></div></div>
        <div id="mobile-interact" class="mobile-btn hidden">HAND</div>
        <div id="mobile-drop" class="mobile-btn hidden">DROP</div>
        <div id="mobile-shoot" class="mobile-btn hidden" style="background: rgba(255,0,0,0.4);">SHOOT</div>
        <div id="mobile-domain" class="mobile-btn hidden" style="background: rgba(150,0,255,0.4); bottom: 350px; right: 40px;">DOMAIN</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/" } }
    </script>
    <script type="module" src="client.js"></script>
</body>
</html>
